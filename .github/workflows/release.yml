name: Build and Release Binaries

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: relay-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: relay-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: relay-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows (.zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/bin -Force
          Copy-Item target/${{ matrix.target }}/release/relay-server.exe dist/bin/
          Copy-Item target/${{ matrix.target }}/release/relay-client.exe dist/bin/
          Copy-Item install.ps1 dist/
          Copy-Item mdfiles/README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package Unix (.tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/bin
          cp target/${{ matrix.target }}/release/relay-server dist/bin/
          cp target/${{ matrix.target }}/release/relay-client dist/bin/
          cp install.sh dist/
          cp mdfiles/README.md dist/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            relay-*.zip
            relay-*.tar.gz
